apiVersion: v1
kind: ConfigMap
metadata:
  name: yas-mcp-config
  namespace: yas-mcp
data:
  config.yaml: |
    server:
      mode: http
      host: 0.0.0.0
      port: 3000
      name: "yas-mcp"
      version: "0.1.0"

    logging:
      level: info
      format: json
      color: false

    endpoint:
      base_url: "http://prism:4010"

    a2a:
      enabled: true
      agent_card_name: "yas-mcp / K8s Agent"
      agent_card_description: "MCP server deployed on Kubernetes"
      streaming_enabled: true
      task_ttl: 3600

    cache:
      enabled: true
      default_ttl_secs: 60
      max_entries: 500

    swagger_file: "/config/openapi.yaml"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yas-mcp-openapi-spec
  namespace: yas-mcp
data:
  openapi.yaml: |
    openapi: "3.0.3"
    info:
      title: "Example API"
      version: "1.0.0"
    servers:
      - url: http://localhost:4010
    paths:
      /health:
        get:
          operationId: get_health
          summary: Health check
          responses:
            "200":
              description: OK
      /users:
        get:
          operationId: get_users
          summary: List users
          parameters:
            - name: page
              in: query
              schema:
                type: integer
          responses:
            "200":
              description: List of users
      /users/{userId}:
        get:
          operationId: get_user_by_id
          summary: Get user by ID
          parameters:
            - name: userId
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: User details
