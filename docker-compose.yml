services:
  yas-mcp:
    # profiles: ["mcp", "test"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yas-mcp-server
    ports:
      - "${OPENAPI_MCP_PORT:-3002}:3000"
    volumes:
      - ./${SWAGGER_FILE_PATH:?SWAGGER_FILE_PATH is required}:/app/config/swagger.yaml:ro
      - ./${ADJUSTMENTS_FILE_PATH:-./adjustments.yaml}:/app/config/adjustments.yaml:ro
      - ./config.yaml:/app/config/config.yaml:ro
    environment:
      - OPENAPI_MCP_SERVER_MODE=${SERVER_MODE:-http}
      - OPENAPI_MCP_SERVER_HOST=0.0.0.0
      - OPENAPI_MCP_SERVER_PORT=3000
      - OPENAPI_MCP_ENDPOINT_BASE_URL=${API_BASE_URL:-http://prism:4010}
      - OPENAPI_MCP_LOGGING_LEVEL=${LOG_LEVEL:-info}
      - OPENAPI_MCP_LOGGING_FORMAT=${LOG_FORMAT:-compact}
      - OPENAPI_MCP_SWAGGER_FILE=/app/config/swagger.yaml
      - OPENAPI_MCP_ADJUSTMENTS_FILE=/app/config/adjustments.yaml
      - YAS_MCP_A2A_ENABLED=true
      - YAS_MCP_A2A_AGENT_CARD_NAME=yas-mcp Demo Agent
      - YAS_MCP_A2A_AGENT_CARD_DESCRIPTION=MCP server demo with A2A protocol
      - YAS_MCP_A2A_STREAMING_ENABLED=true
      - RUST_LOG=info
    command: ["--config", "/app/config/config.yaml", "--swagger-file", "/app/config/swagger.yaml", "--adjustments-file", "/app/config/adjustments.yaml", "--endpoint", "${API_BASE_URL:-http://prism:4010}", "--mode", "${SERVER_MODE:-http}", "--host", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped
    networks:
      - yas-mcp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # HARDENING
    read_only: false
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /app/logs:size=32M,mode=1777
      - /home/app:size=8M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 100
    cpus: 1

  prism:
    image: stoplight/prism:5
    container_name: prism-mock
    # profiles: ["auth", "test"]
    ports:
      - "${PRISM_PORT:-4010}:4010"
    volumes:
      - ./${SWAGGER_FILE_PATH:?SWAGGER_FILE_PATH is required}:/tmp/openapi.yaml:ro
    command: ["mock", "-h", "0.0.0.0", "/tmp/openapi.yaml"]
    networks:
      - yas-mcp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4010/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # HARDENING
    # read_only: true
    # tmpfs:
    #   - /tmp:size=64M,mode=1777
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true
    # user: "1000:1000"
    # mem_limit: 256m
    # pids_limit: 50

  test-container:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-tests
    depends_on:
      - yas-mcp
      - prism
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
      - API_BASE_URL=http://prism:4010
      - SWAGGER_FILE_PATH=${SWAGGER_FILE_PATH}
      - RUST_LOG=debug
      - TEST_TIMEOUT=90
      - OPENAPI_MCP_PORT=${OPENAPI_MCP_PORT:-3000}
      - PRISM_PORT=${PRISM_PORT:-8080}
    networks:
      - yas-mcp-network
    volumes:
      - ./test-results:/app/test-results
      - .:/app:ro
      - ./scripts/test-integration.sh:/app/scripts/test-integration.sh:ro
    profiles: ["test"]
    command: ["/app/scripts/test-integration.sh"]
    # # HARDENING
    # read_only: true
    # tmpfs:
    #   - /tmp:size=128M,mode=1777
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true
    # mem_limit: 1g
    # pids_limit: 200

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN environment variable is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD environment variable is required}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8081
      KC_HTTP_ENABLED: true
    ports:
      - "8081:8080"
    command: start-dev
    networks:
      - yas-mcp-network
    # # HARDENING (limited - keycloak needs more perms)
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE
    # security_opt:
    #   - no-new-privileges:true
    # mem_limit: 1g
    # pids_limit: 200

  # ── E2E Test Suite (profile: e2e) ──────────────────────────────────────
  # Runs the full Rust integration test binary against live services
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-e2e-tests
    profiles: ["e2e"]
    depends_on:
      yas-mcp:
        condition: service_healthy
      prism:
        condition: service_started
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
      - PRISM_URL=http://prism:4010
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - TEST_BEARER_TOKEN=e2e-test-token-12345
      - SWAGGER_FILE_PATH=/app/examples/todo-app/openapi.yaml
    networks:
      - yas-mcp-network
    volumes:
      - ./test-results:/app/test-results
      - ./configs/e2e-config.yaml:/app/e2e-config.yaml:ro
    command:
      - /bin/sh
      - -c
      - |
        echo "=== Running E2E Tests ===" && \
        echo "MCP Server: $$MCP_SERVER_URL" && \
        echo "Prism: $$PRISM_URL" && \
        echo "" && \
        echo "--- Phase 1: Health & Connectivity ---" && \
        for i in $$(seq 1 30); do \
          if curl -sf "$$MCP_SERVER_URL/health" > /dev/null 2>&1; then \
            echo "✅ MCP server healthy (attempt $$i)"; break; \
          fi; \
          echo "  waiting... ($$i/30)"; sleep 2; \
        done && \
        echo "" && \
        echo "--- Phase 2: MCP Protocol Tests ---" && \
        cargo test --test integration_tests -- --nocapture --include-ignored 2>&1 || true && \
        echo "" && \
        echo "--- Phase 3: E2E Bash Verification ---" && \
        /app/scripts/test-integration.sh && \
        echo "" && \
        echo "=== E2E Tests Complete ==="

  # ── A2A Protocol Tests (profile: a2a) ──────────────────────────────────
  a2a-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-a2a-tests
    profiles: ["a2a"]
    depends_on:
      yas-mcp:
        condition: service_healthy
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    networks:
      - yas-mcp-network
    volumes:
      - ./test-results:/app/test-results
    command:
      - /bin/sh
      - -c
      - |
        echo "=== A2A Protocol Tests ===" && \
        echo "Server: $$MCP_SERVER_URL" && \
        echo "" && \
        echo "--- Checking Agent Card ---" && \
        curl -sf "$$MCP_SERVER_URL/.well-known/agent-card.json" | jq . && \
        echo "" && \
        echo "--- Sending A2A Task ---" && \
        TASK_RESPONSE=$$(curl -s -X POST "$$MCP_SERVER_URL/a2a/tasks/send" \
          -H "Content-Type: application/json" \
          -d '{
            "id": "e2e-task-001",
            "sessionId": "e2e-session",
            "message": {
              "role": "user",
              "parts": [{"type": "data", "data": {"skill": "get_health", "parameters": {}}}]
            }
          }') && \
        echo "$$TASK_RESPONSE" | jq . && \
        TASK_ID=$$(echo "$$TASK_RESPONSE" | jq -r '.id') && \
        echo "" && \
        echo "--- Getting Task Status ---" && \
        curl -sf "$$MCP_SERVER_URL/a2a/tasks/get?id=$$TASK_ID" | jq . && \
        echo "" && \
        echo "--- Cancelling Task ---" && \
        curl -s -X POST "$$MCP_SERVER_URL/a2a/tasks/cancel" \
          -H "Content-Type: application/json" \
          -d "{\"id\": \"$$TASK_ID\", \"sessionId\": \"e2e-session\"}" | jq . && \
        echo "" && \
        echo "=== A2A Tests Complete ==="

  # ── Auth + Secrets Tests (profile: auth-test) ───────────────────────────
  auth-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-auth-tests
    profiles: ["auth-test"]
    depends_on:
      yas-mcp:
        condition: service_healthy
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
      - TEST_BEARER_TOKEN=e2e-test-token-12345
    networks:
      - yas-mcp-network
    volumes:
      - ./test-results:/app/test-results
      - /tmp/yas-mcp-secrets:/run/secrets:ro
    command:
      - /bin/sh
      - -c
      - |
        echo "=== Auth & Secrets Tests ===" && \
        echo "Server: $$MCP_SERVER_URL" && \
        echo "" && \
        echo "--- Test 1: Unauthenticated request (should succeed on /health) ---" && \
        curl -sf -w "\nHTTP %{http_code}\n" "$$MCP_SERVER_URL/health" && \
        echo "" && \
        echo "--- Test 2: Bearer token from env:// (should pass auth) ---" && \
        curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $$TEST_BEARER_TOKEN" \
          "$$MCP_SERVER_URL/mcp" -X POST \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' && \
        echo "" && \
        echo "--- Test 3: Wrong bearer token (should fail or pass-through) ---" && \
        curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer wrong-token" \
          "$$MCP_SERVER_URL/mcp" -X POST \
          -H "Content-Type: application/json" \
          -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' && \
        echo "" && \
        echo "=== Auth Tests Complete ==="

  # ── Unit Tests (profile: unit-test) — no server needed ──────────────────
  unit-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-unit-tests
    profiles: ["unit-test"]
    environment:
      - RUST_LOG=warn
      - CARGO_TERM_COLOR=always
    volumes:
      - ./test-results:/app/test-results
    command:
      - /bin/sh
      - -c
      - |
        echo "=== Unit Tests ===" && \
        cargo test --lib -- --nocapture 2>&1 && \
        echo "" && \
        echo "=== Adjuster Tests ===" && \
        cargo test --test adjuster_tests -- --nocapture 2>&1 && \
        echo "" && \
        echo "=== Clippy ===" && \
        cargo clippy --all-targets --all-features -- -D warnings 2>&1 && \
        echo "" && \
        echo "=== Unit Tests Complete ==="

  # ── Flying Probe (profile: probe) — Continuous board testing ──────────
  flying-probe:
    image: curlimages/curl:latest
    container_name: yas-mcp-flying-probe
    profiles: ["probe"]
    depends_on:
      yas-mcp:
        condition: service_healthy
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
    networks:
      - yas-mcp-network
    volumes:
      - ./scripts/flying-probe.sh:/probe.sh:ro
    entrypoint: ["/bin/sh", "/probe.sh"]

  # ── Dex OIDC Provider (profile: oidc) ──────────────────────────────────
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    profiles: ["oidc", "e2e-full"]
    container_name: yas-mcp-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./configs/dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
    networks:
      - yas-mcp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Full-Stack E2E Tests (profile: e2e-full) ───────────────────────────
  # Tests: OpenAPI → MCP → A2A → OIDC (Dex) → authenticated calls → secrets
  e2e-full-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: yas-mcp-e2e-full-tests
    profiles: ["e2e-full"]
    depends_on:
      yas-mcp:
        condition: service_healthy
      dex:
        condition: service_healthy
      prism:
        condition: service_started
    environment:
      - MCP_SERVER_URL=http://yas-mcp:3000
      - DEX_URL=http://dex:5556
      - E2E_OIDC_CLIENT_SECRET=e2e-client-secret
      - RUST_LOG=debug
    networks:
      - yas-mcp-network
    volumes:
      - ./test-results:/app/test-results
      - ./scripts/e2e-full-test.sh:/app/scripts/e2e-full-test.sh:ro
    command: ["bash", "/app/scripts/e2e-full-test.sh"]

networks:
  yas-mcp-network:
    driver: bridge
    internal: false  # set true if no external access needed