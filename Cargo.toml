[package]
name = "yas-mcp"
description = "yet another swagger mcp"
version = "0.1.0"
edition = "2024"
build = "build.rs"  # Add this line for build scripts
license = "AGPL-3.0-only"

[features]
default = []
test-utils = []
record-replay = []             # Record/replay API responses (experimental)

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "2.0"

# MCP SDK
rmcp = { version = "3.0.1", features = [
    "transport-async-rw", 
    "transport-streamable-http-server",
    "transport-worker",
    "server",
    ] }
rmcp-macros = "3.0.1"
schemars = "1.1"

# Web/HTTP dependencies
reqwest = { version = "0.13", features = ["json"] }
axum = "0.8.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }

# OpenAPI handling
openapiv3 = { version = "2.0.0-rc.1" }

# Configuration
config = "0.15"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For potential TUI (if we keep that functionality)
crossterm = "0.29"
async-trait = "0.1.89"
futures-util = "0.3.31"
tokio-stream = "0.1.17"
async-stream = "0.3.6"
tokio-util = "0.7.17"
futures = "0.3.31"
uuid = { version = "1.18.1", features = ["serde"] }
regex = "1.10.4"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"

# gRPC
tonic = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
glob-match = "0.2"
prometheus = { version = "0.14", features = ["process"] }
jsonwebtoken = "11"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[build-dependencies]
vergen = { version = "10.0.1", features = ["build", "si", "rustc", "cargo"] }
anyhow = "1.0"
tonic-build = "0.14"

[[test]]
name = "stdio_protocol_tests"
path = "tests/stdio_protocol_tests.rs"
required-features = ["test-utils"]

[[bench]]
name = "parser_benchmarks"
harness = false
required-features = ["test-utils"]
